<div class="containerGrande">
    <aside class="container">
        <!-- Bloque superior: Logo + Cuenta + Botón -->
        <div class="header-sidebar">
            <div class="logo" routerLink='/inicio' (click)="paso=1">
                <img src="assets/logoArcme.png" alt="Logo Arcme" >
                <div class="lh-1">
                    <span class="fs-3 fw-bold text-dark d-block lh-1" style="letter-spacing: -0.5px;">arcme</span>
                </div>
            </div>

            <div class="cuenta">
                <img src="" alt="Foto usuario">
                <h3>Octavio</h3>
            </div>

            <hr class="linea-horizontal">
            <div class="btn">
                <i class="bi bi-plus-circle"></i>
                <a>Cargar Proyecto</a>
            </div>
        </div>

        <hr class="linea-horizontal">
        <!-- Secciones principales (toma el espacio libre) -->
        <nav class="secciones">
            <ul>
                <li [class.activo]="paso===1">
                    <i class="bi bi-house-door"></i>
                    <a routerLink='/inicio' (click)="paso=1">Inicio</a>
                </li>
                <li [class.activo]="paso===2">
                    <i class="bi bi-folder"></i>
                    <a routerLink='/proyectos'(click)="paso=2">Proyectos</a>
                </li>
                <li [class.activo]="paso===3">
                    <i class="bi bi-calendar4-week"></i>
                    <a routerLink='/agenda' (click)="paso=3">Agenda</a>
                </li>
                <li [class.activo]="paso===4">
                    <i class="bi bi-book"></i>
                    <a routerLink='/portfolio' (click)="paso=4">Portfolio</a>
                </li>
                <li [class.activo]="paso===5">
                    <i class="bi bi-currency-dollar"></i>
                    <a routerLink='/ingresos' (click)="paso=5">Ingresos</a>
                </li>
                <li [class.activo]="paso===6">
                    <i class="bi bi-people"></i>
                    <a routerLink='/clientes' (click)="paso=6">Clientes</a>
                </li>
                <li [class.activo]="paso===7">
                    <i class="bi bi-person-rolodex"></i>
                    <a routerLink='/proveedores' (click)="paso=7">Proveedores</a>
                </li>
            </ul>
        </nav>

        <!-- Configuración al final -->
        <div class="configuracion">
            <ul>
                <li [class.activo]="paso===8">
                    <i class="bi bi-gear"></i>
                    <a routerLink='/configuracion'(click)="paso=8">Configuración</a>
                </li>
                <li>
                    <i class="bi bi-box-arrow-right"></i>
                    <a href="#">Cerrar Sesión</a>
                </li>
            </ul>
        </div>
    </aside>

    <div class="linea-vertical"></div>
</div>
