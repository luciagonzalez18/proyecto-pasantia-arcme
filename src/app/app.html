<div class="page" [class.sin-menu]="!mostrarMenu()"> <!-- Cuando mostrarMenu devuelva false al div "page" se le agrega la class sin-menu-->

    @if(mostrarMenu()){
        <app-menu></app-menu>
    }

    <main class="main-content">
        <router-outlet></router-outlet>
    </main>

    <app-footer></app-footer>

     <!--Modal agregar proyectos-->

    <div class="modal fade" id="formProyectoModal" tabindex="-1" aria-labelledby="formProyectoModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="formProyectoModalLabel">Nuevo proyecto</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <!-- Nombre del proyecto -->
                        <div class="mb-3">
                            <label for="nombreProyecto" class="form-label">Nombre del proyecto</label>
                            <input type="text" class="form-control" id="nombreProyecto"
                                placeholder="Ej: Residencial Los Álamos">
                        </div>

                        <div class="row">
                            <!-- Superficie -->
                            <div class="col-md-6 mb-3">
                                <label for="superficie" class="form-label">Superficie</label>
                                <input type="text" class="form-control" id="superficie" placeholder="Ej: 120 m²">
                            </div>

                            <!-- Ubicación -->
                            <div class="col-md-6 mb-3">
                                <label for="ubicacion" class="form-label">Ubicación</label>
                                <input type="text" class="form-control" id="ubicacion" placeholder="Ej: Neuquén">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Precio -->
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label">Precio</label>
                                <input type="number" class="form-control" id="precio" placeholder="Ej: 50000">
                            </div>

                            <!-- Nomenclatura -->
                            <div class="col-md-6 mb-3">
                                <label for="nomenclatura" class="form-label">Nomenclatura</label>
                                <input type="text" class="form-control" id="nomenclatura"
                                    placeholder="Ej: Nomenclatura catastral">
                            </div>
                        </div>

                        <div class="row">
                            <!-- Fecha de inicio -->
                            <div class="col-md-6 mb-3">
                                <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                                <input type="date" class="form-control" id="fechaInicio">
                            </div>

                            <!-- Fecha estimada de finalización -->
                            <div class="col-md-6 mb-3">
                                <label for="fechaFin" class="form-label">Fecha estimada de finalización</label>
                                <input type="date" class="form-control" id="fechaFin">
                            </div>
                        </div>

                        <!-- Estado -->
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado">
                                <option value="" selected disabled>Seleccione un estado</option>
                                <option value="Finalizada">Finalizada</option>
                                <option value="En proceso">En proceso</option>
                                <option value="Pausada">Pausada</option>
                                <option value="Cancelada">Cancelada</option>
                            </select>
                        </div>

                        <!-- Memoria (Archivo PDF) -->
                        <div class="mb-3">
                            <label for="memoriaPdf" class="form-label">Memoria (Archivo PDF)</label>
                            <input type="file" class="form-control" id="memoriaPdf" accept=".pdf">
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="3"
                                placeholder="Detalles o descripción del proyecto..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>

</div>
