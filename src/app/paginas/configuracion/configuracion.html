```html
<div class="configuracion-pagina">

    <!-- MENÚ LATERAL -->
    <aside>

        <!-- BOTÓN VOLVER -->
        <div class="volver">

            <button class="boton-volver" routerLink="/inicio">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5a.5.5 0 0 0 .5-.5"/>
                </svg>
            </button>

            <h2>Regresar</h2>

        </div>

        <h2 style="font-size: 19px;"><b>Configuración</b></h2>

        <p class="titulo">Mi cuenta</p>

        <button class="opcion-activa" routerLink="/configuracion">
            Perfil personal
        </button>

        <p class="titulo pagina">Página</p>

        <button class="opcion" routerLink="/personalizacion">
            Personalización
        </button>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <h1>Perfil personal</h1>

        <section class="perfil">

            <!-- LOGO -->
            <div class="logo">

                <label class="boton-logo">

                    <input
                        #inputFoto
                        type="file"
                        accept="image/png, image/jpeg, image/webp"
                        (change)="seleccionarFoto($event)"
                        style="display: none;"
                    >

                    @if (fotoPreview) {
                        <img [src]="fotoPreview" alt="Foto de perfil">
                    } @else {
                        <i class="bi bi-card-image"></i>
                    }

                </label>

                <div class="texto-logo">
                    <h3><b>Tu logo</b></h3>
                    <p>Recomendamos elegir un logo o imagen tuya que te represente.</p>
                </div>

            </div>


            <!-- FORMULARIO -->
            <form (ngSubmit)="guardarCambios()">

                <div class="fila">

                    <div class="campo">

                        <label>
                            <span>*</span> Nombre
                        </label>

                        <input
                            type="text"
                            placeholder="Ingrese nombre"
                            [(ngModel)]="nombre"
                            (ngModelChange)="verificarCambios()"
                            name="nombre"
                        >

                    </div>

                    <div class="campo">

                        <label>
                            <span>*</span> Documento
                            <small>(no se puede editar)</small>
                        </label>

                        <input
                            type="text"
                            [value]="dni"
                            disabled
                        >

                    </div>

                </div>


                <div class="fila">

                    <div class="campo">

                        <label>Correo electrónico</label>

                        <input
                            type="email"
                            placeholder="Ingrese correo electrónico"
                            [(ngModel)]="correo"
                            (ngModelChange)="verificarCambios()"
                            name="correo"
                        >

                    </div>

                    <div class="campo">

                        <label>Teléfono</label>

                        <input
                            type="tel"
                            placeholder="Ingrese número de teléfono"
                            [(ngModel)]="telefono"
                            (ngModelChange)="verificarCambios()"
                            name="telefono"
                        >

                    </div>

                </div>


                <!-- BOTONES -->
                <div class="botones">

                    <button
                        type="button"
                        class="descartar"
                        (click)="descartarCambios()"
                        [disabled]="!hayCambios"
                    >
                        Descartar
                    </button>

                    <button
                        type="submit"
                        class="guardar"
                        [disabled]="!hayCambios"
                    >
                        Guardar cambios
                    </button>

                </div>


                <!-- MENSAJES -->
                @if (mensaje) {
                    <p class="mensaje">{{ mensaje }}</p>
                }

                @if (error) {
                    <p class="error">{{ error }}</p>
                }

            </form>

        </section>

    </main>

</div>
