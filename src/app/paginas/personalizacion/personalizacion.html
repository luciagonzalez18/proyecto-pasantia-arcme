
<div class="interfaz-global">

    <!-- MENÚ LATERAL -->
    <aside>

        <!-- BOTÓN VOLVER -->
        <div class="volver">
            <button class="boton-volver" routerLink="/inicio">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5a.5.5 0 0 0 .5-.5"/>
                </svg>
            </button>

            <h2>Regresar</h2>
        </div>

        <h2 class="titulo-configuracion"><b>Configuración</b></h2>

        <p class="titulo">Mi cuenta</p>

        <button class="opcion" routerLink="/configuracion">
            Perfil personal
        </button>

        <p class="titulo pagina">Página</p>

        <button class="opcion-activa" routerLink="/personalizacion">
            Personalización
        </button>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor-apariencia">

        <h1 class="titulo-principal">Apariencia</h1>

        <section class="tarjeta-opciones">

            <!-- MODO OSCURO -->
            <div class="seccion-opcion">

                <div class="texto-opcion">
                    <h2 class="subtitulo-opcion">Modo oscuro</h2>

                    <p class="descripcion">
                        Cambiá la apariencia de la página a un tema oscuro.
                    </p>
                </div>

                <button
                    type="button"
                    class="interruptor"
                    [class.activado]="modoOscuro"
                    [attr.aria-pressed]="modoOscuro"
                    (click)="alternarModoOscuro()"
                    aria-label="Activar o desactivar modo oscuro"
                >
                    <span></span>
                </button>

            </div>


            <!-- COLOR REPRESENTATIVO -->
            <div class="seccion-opcion">

                <div class="texto-opcion">
                    <h2 class="subtitulo-opcion">
                        Color representativo
                    </h2>

                    <p class="descripcion">
                        Los demás verán tu catálogo con este color como fondo.
                    </p>
                </div>

                <div class="selector-color">
                    <div class="circulo-color"></div>
                </div>

            </div>


            <!-- COLOR DE FONDO -->
            <div class="seccion-opcion">

                <div class="texto-opcion">
                    <h2 class="subtitulo-opcion">
                        Color de fondo
                    </h2>

                    <p class="descripcion">
                        Vos verás este color como fondo de la página.
                    </p>
                </div>

                <div class="selector-color">
                    <div class="circulo-color"></div>
                </div>

            </div>

        </section>

    </main>

</div>
