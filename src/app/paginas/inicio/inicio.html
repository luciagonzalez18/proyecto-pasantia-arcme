<div class="container">
    <hr class="linea-horizontal">
    <h1>¡Hola Octavio!</h1>
    <hr class="linea-horizontal">
    <div class="imagenes">
        <div class="row g-2 ">
            <div class="col-3">
                <img src="assets/imagenHOME1.jpg" alt="imagen1">
            </div>
            <div class="col-3">
                <img src="assets/imagenHOME2.jpg" alt="imagen2">
            </div>
            <div class="col-3">
                <img src="assets/imagenHOME3.jpg" alt="imagen3">
            </div>

        </div>
        <div class="row g-2">
            <div class="col-4">
                <img src="assets/imagenHOME1.jpg" alt="imagen1">
            </div>
            <div class="col-4">
                <img src="assets/imagenHOME2.jpg" alt="imagen2">
            </div>
            <div class="col-4">
                <img src="assets/imagenHOME3.jpg" alt="imagen3">
            </div>
        </div>
    </div>
    <hr class="linea-horizontal">


</div>

<div class="proximos-lista">
  <h3><i class="bi bi-calendar4-week"></i><b> Recordatorio</b></h3>
  @for (ev of proximosEventos; track ev.id_evento) {
  <div class="proximo" [attr.dato-cat]="ev.categoria">
    <span class="fecha">{{ formatoFecha(ev.fecha) }}- {{ ev.hora }} hs</span>
    <span class="titulo">{{ ev.titulo }}</span>
    <p class="descripcion">{{ ev.descripcion }}</p>
  </div>
  } @empty {
  <p>No hay eventos próximos.</p>
  }
</div>
