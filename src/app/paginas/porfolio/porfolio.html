<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Porfolio</title>

    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="porfolio.css">
</head>

<body>

    <!-- Encabezado -->
    <div class="encabezado-portfolio">
        <h1 class="logotipo">Porfolio</h1>

        <div class="botones-encabezado">
            <button class="boton-borde">
                <i class="bi bi-pencil-square"></i> Editar Porfolio
            </button>

            <button class="boton-borde">
                <i class="bi bi-link-45deg"></i> Compartir Porfolio
            </button>
        </div>
    </div>

    <div class="barra-separadora-superior"></div>

    <!-- Grilla de tarjetas -->
    <div class="contenedor-grilla">
        @if(proyectoPortfolio.length===0){
        <h1>No tiene proyectos en su Portfolio</h1>
        }@else{
        @for(p of proyectoPortfolio; track p.id_obra){
        <div class="tarjeta">
            <div class="cabecera-tarjeta">
                <div>
                    <h2>{{p.titulo}}</h2>
                    <p class="subtitulo">Última actualización</p>
                </div>
                <i class="bi bi-gear-fill icono-configuracion"></i>
            </div>

            <div class="imagen-principal">
                <i class="bi bi-card-image"></i>
            </div>

            <div class="fila-miniaturas">
                <div class="miniatura"><i class="bi bi-card-image"></i></div>
                <div class="miniatura"><i class="bi bi-card-image"></i></div>
                <div class="miniatura"><i class="bi bi-card-image"></i></div>
                <div class="miniatura-mas">+10</div>
            </div>

            <div class="tabla-info">
                <div class="columna-info borde-derecho">
                    <span class="titulo-info"><i class="bi bi-geo-alt-fill"></i> Ubicación</span>
                    <span class="valor-info">{{p.ubicacion}}</span>
                </div>
                <div class="columna-info borde-derecho">
                    <span class="titulo-info"><i class="bi bi-calendar3"></i> Fecha</span>
                    <span class="valor-info">Fecha de inicio<br>{{p.fecha_inicio}}</span>
                </div>
                <div class="columna-info borde-derecho">
                    <span class="titulo-info"><i class="bi bi-info-square-fill"></i> Estado</span>
                    <span class="valor-info">{{p.estado}}</span>
                </div>
                <div class="columna-info">
                    <span class="titulo-info"><i class="bi bi-book"></i> Memoria</span>
                    <span class="etiqueta-pdf"><i class="bi bi-file-pdf"></i>{{p.memoria}}</span>
                </div>
            </div>

            <div class="fila-acciones">
                <button class="boton-icono"><i class="bi bi-trash-fill"></i></button>
                <div class="acciones-derecha">
                    <button class="boton-texto"><i class="bi bi-link-45deg"></i> Compartir</button>
                    <button class="boton-texto texto-negrita">Ver Más »</button>
                </div>
            </div>
        </div>
        }
        }

    </div>

</body>

</html>
