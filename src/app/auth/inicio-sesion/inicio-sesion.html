<div class="container">
  <form>
    <div class="containerLogo">
      <img class="logo" src="assets/logoArcme.jpg" alt="Logo Arcme">
    </div>

    <div class="mb-3 containerDNI">
      <label>DNI</label>
      <input type="number" id="dni" placeholder="XX-XXX-XXX">
    </div>

    <div class="mb-3 containerContraseña">
      <label for="contraseña">Contraseña</label>
      <input type="password" id="contraseña" placeholder="############">
    </div>

    <a href="#" class="olvidarContraseña">Has olvidado la contraseña?</a>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="exampleCheck1">
      <label class="form-check-label" for="exampleCheck1">Recordarme</label>
    </div>

    <button type="submit" class="btn btnIniciarSesion" click="iniciarSesion()">Iniciar Sesion</button>

    <div class="divisor">
      <h3>O</h3>
    </div>

    <button type="button" class="btn btnRegistro">Registrarse</button>
  </form>
</div>

<footer>
  <div class="footer-links">
    <a href="#">Contactanos</a>
    <a href="#">Ayuda</a>
    <a href="#">Acerca de nosotros</a>
  </div>
  <p class="copyright">Copyright © 2026</p>
</footer>
