<form>
    
    <div class="mb-3">

        <input type="email" class="form-control" id="exampleDNI" aria-describedby="DNIhelp">
        <div id="DNIhelp" class="form-text">We'll never share your DNI with anyone else.</div>
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="exampleInputPassword1">
    </div>
    <div class="mb-3">
        <label for="exampleInputPassword2" class="form-label">Repita su contraseña </label>
        <input type="password" class="form-control" id="exampleInputPassword2">
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
    </div>
    <button type="submit" class="btn btn-primary">Continuar</button>
    <p>¿Ya tienes una cuenta?</p>
    <button type="submit" class="btn btn-primary">Iniciar sesión</button>
